name: linux-verify

# M0.4-D: runs the authoritative Linux verification gate on a real Linux host.
# The script is the entry point; this workflow only provisions the runner and
# publishes its logs. Verification logic must not be duplicated here.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

# Least privilege: the gate only reads the repository.
permissions:
  contents: read

concurrency:
  group: linux-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: M0.4-D Linux verification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout and actions/upload-artifact are GitHub-maintained.
      # No third-party actions are used.
      - name: Check out
        uses: actions/checkout@v4

      - name: Record toolchain
        run: |
          uname -srm
          cmake --version | head -1
          ctest --version | head -1
          gcc --version | head -1
          clang --version | head -1
          echo "runner: ${ImageOS:-unknown} ${ImageVersion:-unknown}"

      - name: Run verification gate
        id: gate
        # Keep going so logs are uploaded even when the gate fails.
        continue-on-error: true
        run: |
          set -o pipefail
          bash scripts/linux/dev-verify.sh 2>&1 | tee verify.log

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-verify-logs
          path: |
            verify.log
            build/verify/logs/**
          if-no-files-found: warn
          retention-days: 14

      - name: Report gate conclusion
        if: always()
        run: |
          if [ "${{ steps.gate.outcome }}" = "success" ]; then
            echo "M0.4-D Linux gate: PASSED"
          else
            echo "M0.4-D Linux gate: FAILED (see the linux-verify-logs artifact)"
          fi

      - name: Fail if the gate did not pass
        if: steps.gate.outcome != 'success'
        run: exit 1
